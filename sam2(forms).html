<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h2>Welcome To Samad's World</h2>
    <h4>(Please fill the form if you want to proceed)</h4>
   
    <form action="backend.php">
        <label for="name"> Name </label>
        <div>
           <input type="text" name="myName" id="name">
        </div>
        <br>
        <label for="role"> Role </label>
        <div>
            <input type="text" name="myRole" id="role">
        </div>
        <br>
        <label for="email"> Email </label>
        <div>
             <input type="email" name="myEmail" id="email">
         </div>
         <br>
         <label for="date"> Date </label>
         <div>
             <input type="date" name="myDate" id="date">
         </div>
         <br>
         <label for="bonus"> Bonus </label>
         <div>
             <input type="number" name="myBonus" id="bonus">
         </div>
         <br>
         <label for="disable">  Are you disable?  </label>
         <div>
           <input type="checkbox" name="myEligibility" id="disable">
         </div>
         <br>
         <label for="gender"> Gender </label>
         <div>
             Male<input type="radio" name="myGender"> female<input type="radio" name="myGender"> Other<input type="radio" name="myGender" id="gender">
         </div>
         <br>
         <label for="Yourself"> Write about yourself </label>
         <div>
            <br> <textarea name="myText" id="Yourself" rows="10" cols="100">  </textarea>
         </div>
         <br>
         <div>
            <input type="submit" value="Submit now">
            <input type="reset" value="Reset now">
         </div>
         <br>

    </form>
    
</body>
</html>
